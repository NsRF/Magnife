# Weekly dependency updates, grouped so each ecosystem opens at most one pull request.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /ingest
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "build(ingest)"

  - package-ecosystem: swift
    directory: /app
    schedule:
      interval: weekly
    # Sparkle is pinned exactly on purpose (docs/RELEASE.md): update it by hand with a release.
    ignore:
      - dependency-name: "*sparkle*"
      - dependency-name: "*Sparkle*"
    groups:
      swift:
        patterns: ["*"]
    commit-message:
      prefix: "build(app)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Go helper
    # The busy-port checks read macOS's lsof and ps output.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      - name: The helper's schema is a byte-identical copy of the contract
        run: cmp ../docs/schema.sql internal/store/schema.sql
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  app:
    name: MagnifeKit
    # The package needs Swift 6.3 (tools version 6.3) and the macOS 26 SDK,
    # which the runner's newest stable Xcode has. Only the library and its
    # tests are built: the app itself is built with Xcode 27 (app/build.sh).
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build --product MagnifePackageTests
      - run: swift test --skip-build
